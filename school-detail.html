<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Detail — CollegeTracker</title>
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/pages/school-detail.css">
</head>
<body>
  <nav id="navbar"></nav>
  <div id="readonly-banner"></div>
  <main class="container">
    <a href="colleges.html" class="back-link animate-in" data-delay="1">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to My Colleges
    </a>

    <div class="school-header animate-in" data-delay="1" id="school-header">
      <!-- Populated by JS -->
    </div>

    <div class="school-detail-grid animate-in" data-delay="2">
      <section class="card school-info" id="school-info">
        <div class="card__header">
          <h2 class="card__title">School Info</h2>
          <button class="btn btn--ghost btn--sm btn--edit" data-action="edit-info">Edit</button>
        </div>
        <div id="school-info-body">
          <!-- Populated by JS -->
        </div>
      </section>

      <section class="card school-checklist" id="school-checklist">
        <div class="card__header">
          <h2 class="card__title">Checklist <span class="checklist-count" id="checklist-count"></span></h2>
        </div>
        <ul class="checklist" id="checklist-items">
          <!-- Populated by JS -->
        </ul>
        <button class="btn btn--ghost btn--add checklist-add" data-action="add-checklist-item">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add item
        </button>
      </section>
    </div>

    <section class="card school-notes animate-in" data-delay="3">
      <div class="card__header">
        <h2 class="card__title">Notes</h2>
      </div>
      <textarea class="textarea" id="school-notes" placeholder="Add notes about this school..."></textarea>
    </section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components.js"></script>
  <script src="js/school-detail.js"></script>
</body>
</html>
