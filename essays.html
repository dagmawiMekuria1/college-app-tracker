<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essays — CollegeTracker</title>
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/pages/essays.css">
</head>
<body>
  <nav id="navbar"></nav>
  <div id="readonly-banner"></div>
  <main class="container">
    <div class="page-header animate-in" data-delay="1">
      <h1 class="page-title">Essays</h1>
      <button class="btn btn--primary btn--add" data-action="add-essay">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Essay
      </button>
    </div>

    <div class="essay-list animate-in" data-delay="2" id="essay-list">
    </div>

    <div class="empty-state" id="essays-empty" style="display:none;">
      <svg class="empty-state__icon" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M40 6H16a4 4 0 0 0-4 4v44a4 4 0 0 0 4 4h32a4 4 0 0 0 4-4V18z"/><polyline points="40 6 40 18 52 18"/><line x1="20" y1="28" x2="44" y2="28"/><line x1="20" y1="36" x2="44" y2="36"/><line x1="20" y1="44" x2="34" y2="44"/></svg>
      <h3 class="empty-state__title">No essays yet</h3>
      <p class="empty-state__subtitle">Create an essay entry to track your writing progress.</p>
      <button class="btn btn--primary btn--add" data-action="add-essay">+ Add Essay</button>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components.js"></script>
  <script src="js/essays.js"></script>
</body>
</html>
